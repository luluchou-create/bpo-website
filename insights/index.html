<script>
/* 中文標題不拆詞（Lulu 2026-10-18：例如「清楚」不能斷成「清／楚」）：
   用瀏覽器內建的斷詞，把標題、引言、圖說裡的每個詞包起來不讓它從中間斷行；「3 到 5 年」這類數字片語也綁在一起 */
(function(){
  var SEL='h1,h2,h3,h4,.art-pull,blockquote,figcaption,.ins-card h3';
  var NUM=/[0-9０-９][0-9０-９.,%％]*(?:\s*[到至~～\-–－]\s*[0-9０-９][0-9０-９.,%％]*)?\s*(?:[年月日週天個次人家倍成萬億元則張篇位間項%％]|小時|分鐘)?/g;
  var seg=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter('zh-Hant',{granularity:'word'}):null;
  function nw(t){var s=document.createElement('span');s.style.whiteSpace='nowrap';s.textContent=t;return s;}
  function wrapText(node){
    var text=node.nodeValue; if(!/[㐀-鿿]/.test(text))return;
    var frag=document.createDocumentFragment(), last=0, m; NUM.lastIndex=0;
    var parts=[];
    while((m=NUM.exec(text))){ if(!m[0])break; if(m.index>last)parts.push([text.slice(last,m.index),0]); parts.push([m[0],1]); last=m.index+m[0].length; }
    if(last<text.length)parts.push([text.slice(last),0]);
    parts.forEach(function(p){
      if(p[1]){frag.appendChild(nw(p[0]));return;}
      if(!seg){frag.appendChild(document.createTextNode(p[0]));return;}
      Array.from(seg.segment(p[0])).forEach(function(x){
        var w=x.segment;
        if(x.isWordLike&&w.length>1&&w.length<=8)frag.appendChild(nw(w)); else frag.appendChild(document.createTextNode(w));
      });
    });
    node.parentNode.replaceChild(frag,node);
  }
  document.querySelectorAll(SEL).forEach(function(el){
    var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null), list=[], n;
    while((n=w.nextNode()))list.push(n);
    list.forEach(wrapText);
  });
})();
(function(){
  var figs=document.querySelectorAll('.anim');
  figs.forEach(function(f){f.querySelectorAll('.ln').forEach(function(l){try{l.style.setProperty('--len',Math.ceil(l.getTotalLength()))}catch(e){}})});
  if(!('IntersectionObserver' in window)){figs.forEach(function(f){f.classList.add('in')});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.35});
  figs.forEach(function(f){io.observe(f)});
  var vio=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting){var p=v.play();if(p&&p.catch)p.catch(function(){});}else{v.pause();}})},{threshold:.4});
  document.querySelectorAll('.art-fig video').forEach(function(v){v.removeAttribute('autoplay');vio.observe(v)});
})();
</script>
